name: Deploy FuelLog AI Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-ai-worker.yml"

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            GEMINI_API_KEY
            APP_TOKEN
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_TOKEN: ${{ secrets.FUELLOG_APP_TOKEN }}
