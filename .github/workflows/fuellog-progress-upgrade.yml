name: Apply FuelLog progress tracking upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuellog-progress-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply progress tracking upgrade
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "3b1c93ace4868fe09d3756f86cea56d8136ba202"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          def r(a,b):
              global s
              assert s.count(a)==1, s.count(a)
              s=s.replace(a,b,1)
          r('      <div id="wList" style="margin-top:10px"></div>\n    </div>\n    <div class="card">\n      <div class="h">TREND → 15–17% BF</div>','      <div id="wList" style="margin-top:10px"></div>\n    </div>\n    <div class="card">\n      <div class="h">NAVEL MEASUREMENT</div>\n      <div class="row">\n        <input id="navelDate" type="date" aria-label="Measurement date" style="flex:1.25">\n        <input id="navelIn" type="number" step="0.1" inputmode="decimal" placeholder="cm — e.g. 88.5" aria-label="Navel circumference cm" style="flex:1.4">\n        <button class="btn" id="navelLog">Log</button>\n      </div>\n      <p class="tiny">Measure around the abdomen at navel level, relaxed after a normal exhale. Use the same spot and conditions each time; once a week is enough.</p>\n      <svg id="chNavel" width="100%" height="100" viewBox="0 0 300 100" preserveAspectRatio="none" aria-label="Navel circumference trend chart" style="margin-top:10px"></svg>\n      <div class="muted" id="chNavelCap" style="font-size:11.5px;margin:2px 0 6px"></div>\n      <div id="navelList"></div>\n    </div>\n    <div class="card">\n      <div class="h">PROGRESS PHOTOS</div>\n      <div class="row" style="margin-bottom:8px">\n        <input id="photoDate" type="date" aria-label="Progress photo date" style="flex:1.25">\n        <select id="photoAngle" aria-label="Progress photo angle" style="flex:1">\n          <option value="front">Front</option>\n          <option value="side">Side</option>\n          <option value="back">Back</option>\n        </select>\n      </div>\n      <input id="progPhotoIn" type="file" accept="image/*" class="hidden" aria-label="Choose progress photo">\n      <button class="btn full" id="progPhotoBtn">＋ Add progress photo</button>\n      <p class="tiny">Photos stay in this browser/PWA on your device — they are not uploaded to GitHub or included in the CSV. FuelLog compresses them to save space. Clearing site data will remove them.</p>\n      <div id="photoCompare" style="margin-top:12px"></div>\n      <div id="photoList" style="margin-top:6px"></div>\n    </div>\n    <div class="card">\n      <div class="h">TREND → 15–17% BF</div>')
          r('      <div class="muted" style="font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:4px">BODY FAT % — LOGGED vs 15–17% GOAL</div>','      <div class="muted" style="font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:4px">BODY FAT % — RAW SCALE vs SMOOTHED TREND</div>')
          r('      <p class="tiny">Every meal with date, time, macros, saturated + derived unsaturated fat, the split basis, and gluten flag — plus daily totals and all weigh-ins. Opens in Excel or Google Sheets.</p>','      <p class="tiny">Every meal with date, time, macros, saturated + derived unsaturated fat, the split basis, and gluten flag — plus daily totals, weigh-ins and navel measurements. Progress photos stay on-device and are never included. Opens in Excel or Google Sheets.</p>')
          r('let weights = load("fl:weights",[]);\nlet build = [];','let weights = load("fl:weights",[]);\nlet measurements = load("fl:measurements",[]);\nlet build = [];')
          r('  renderLossLine();\n  renderCharts();\n  renderWeightList();','  renderLossLine();\n  renderCharts();\n  renderWeightList();\n  renderNavel();\n  renderPhotoProgress();')
          r('  renderProgress(); toast("Logged: "+kg+" kg"+(entry.bf?" · "+entry.bf+"% BF":""));\n};\n\n// ── trends charts (MacroFactor-style) ────────────────────────','  renderProgress(); toast("Logged: "+kg+" kg"+(entry.bf?" · "+entry.bf+"% BF":""));\n};\n\n// ── navel circumference tracking ─────────────────────────────\nfunction renderNavel(){\n  const pts=[...measurements].sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);\n  const svg=$("chNavel"), cap=$("chNavelCap"), list=$("navelList");\n  if(pts.length<2){\n    svg.innerHTML="";\n    cap.textContent=pts.length?`Latest: ${(+pts[0].navel).toFixed(1)} cm · add another measurement to see the trend.`:"Log your first navel measurement. Weekly is enough.";\n  } else {\n    const vals=pts.map(p=>+p.navel);\n    const sm=vals.map((v,i)=>{ const w=vals.slice(Math.max(0,i-2),i+1); return w.reduce((a,b)=>a+b,0)/w.length; });\n    let mn=Math.min(...vals,...sm)-0.8, mx=Math.max(...vals,...sm)+0.8;\n    if(mx-mn<2){ const mid=(mx+mn)/2; mn=mid-1; mx=mid+1; }\n    const X=i=>(i/(pts.length-1))*300, Y=v=>100-((v-mn)/(mx-mn))*88-6;\n    let out="";\n    pts.forEach((p,i)=>{ out+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(+p.navel).toFixed(1)}" r="2.8" fill="#9AA6C0"/>`; });\n    out+=`<path d="${sm.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round"/>`;\n    svg.innerHTML=out;\n    const d=vals[vals.length-1]-vals[0];\n    cap.textContent=`Dots = measurements · Blue = 3-reading trend · ${pts[0].date.slice(5)} → ${pts[pts.length-1].date.slice(5)} · ${d>0?"+":""}${d.toFixed(1)} cm`;\n  }\n  const recent=[...measurements].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);\n  list.innerHTML=recent.map(m=>`<div class="meal"><span style="font-weight:600;font-size:14px">${m.date.slice(5)}</span><span style="display:flex;align-items:center;gap:4px"><b>${(+m.navel).toFixed(1)} cm</b><button class="del" data-ndel="${m.date}" aria-label="Delete navel measurement ${m.date}">✕</button></span></div>`).join("");\n}\n$("navelLog").onclick=()=>{\n  const n=parseFloat($("navelIn").value), date=$("navelDate").value||iso(new Date());\n  if(!n||n<40||n>200){ toast("Enter a valid navel measurement in cm"); return; }\n  measurements=[...measurements.filter(m=>m.date!==date),{date,navel:Math.round(n*10)/10}].sort((a,b)=>a.date.localeCompare(b.date));\n  save("fl:measurements",measurements); $("navelIn").value=""; renderNavel(); toast("Navel measurement logged");\n};\ndocument.addEventListener("click",e=>{\n  const nd=e.target.closest("[data-ndel]");\n  if(nd){ measurements=measurements.filter(m=>m.date!==nd.dataset.ndel); save("fl:measurements",measurements); renderNavel(); toast("Measurement deleted"); }\n});\n\n// ── progress photos: private, on-device IndexedDB ───────────\nconst PHOTO_DB="FuelLogMedia", PHOTO_STORE="photos";\nlet photoObjectUrls=[];\nfunction photoDB(){\n  return new Promise((resolve,reject)=>{\n    const r=indexedDB.open(PHOTO_DB,1);\n    r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(PHOTO_STORE)) db.createObjectStore(PHOTO_STORE,{keyPath:"id"}); };\n    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);\n  });\n}\nasync function photoAll(){\n  const db=await photoDB();\n  return new Promise((resolve,reject)=>{ const tx=db.transaction(PHOTO_STORE,"readonly"), r=tx.objectStore(PHOTO_STORE).getAll(); r.onsuccess=()=>resolve(r.result||[]); r.onerror=()=>reject(r.error); });\n}\nasync function photoPut(rec){\n  const db=await photoDB();\n  return new Promise((resolve,reject)=>{ const tx=db.transaction(PHOTO_STORE,"readwrite"); tx.objectStore(PHOTO_STORE).put(rec); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); });\n}\nasync function photoRemove(id){\n  const db=await photoDB();\n  return new Promise((resolve,reject)=>{ const tx=db.transaction(PHOTO_STORE,"readwrite"); tx.objectStore(PHOTO_STORE).delete(id); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); });\n}\nasync function compressProgressPhoto(file){\n  try{\n    const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});\n    const max=1400, scale=Math.min(1,max/Math.max(bmp.width,bmp.height));\n    const w=Math.max(1,Math.round(bmp.width*scale)), h=Math.max(1,Math.round(bmp.height*scale));\n    const c=document.createElement("canvas"); c.width=w; c.height=h;\n    c.getContext("2d").drawImage(bmp,0,0,w,h); if(bmp.close) bmp.close();\n    return await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error("compression failed")),"image/jpeg",0.82));\n  }catch{ return file; }\n}\nasync function renderPhotoProgress(){\n  const box=$("photoCompare"), list=$("photoList"); if(!box||!list||!window.indexedDB) return;\n  photoObjectUrls.forEach(u=>URL.revokeObjectURL(u)); photoObjectUrls=[];\n  try{\n    const all=(await photoAll()).sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));\n    const angle=$("photoAngle").value||"front", pts=all.filter(p=>p.angle===angle);\n    if(!pts.length){ box.innerHTML='<div class="muted" style="text-align:center;padding:12px 0">No '+esc(angle)+' photos yet. Add one now, then repeat under the same lighting and pose.</div>'; }\n    else {\n      const first=pts[0], last=pts[pts.length-1];\n      const u1=URL.createObjectURL(first.blob); photoObjectUrls.push(u1);\n      if(pts.length===1){\n        box.innerHTML=`<div style="text-align:center"><div class="muted" style="font-weight:700;margin-bottom:5px">${first.date} · ${esc(angle.toUpperCase())}</div><img src="${u1}" alt="Progress photo ${first.date}" style="width:72%;max-height:360px;object-fit:cover;border-radius:12px;border:1px solid var(--line)"><div class="tiny">Add another ${esc(angle)} photo later to unlock side-by-side comparison.</div></div>`;\n      } else {\n        const u2=URL.createObjectURL(last.blob); photoObjectUrls.push(u2);\n        box.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><div class="muted" style="font-weight:700;text-align:center;margin-bottom:5px">BEFORE · ${first.date.slice(5)}</div><img src="${u1}" alt="Earlier progress photo ${first.date}" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></div><div><div class="muted" style="font-weight:700;text-align:center;margin-bottom:5px">LATEST · ${last.date.slice(5)}</div><img src="${u2}" alt="Latest progress photo ${last.date}" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></div></div><div class="tiny" style="text-align:center">${pts.length} ${esc(angle)} photo${pts.length===1?"":"s"} · ${first.date} → ${last.date}</div>`;\n      }\n    }\n    const recent=[...all].reverse().slice(0,8);\n    list.innerHTML=recent.length?recent.map(p=>`<div class="meal"><span style="font-size:13px"><b>${p.date.slice(5)}</b> <span class="muted">· ${esc(p.angle)}</span></span><button class="del" data-pdel="${esc(p.id)}" aria-label="Delete progress photo ${p.date}">✕</button></div>`).join(""):"";\n  }catch(err){ console.error("photo render",err); box.innerHTML='<div class="muted">Photo storage is unavailable in this browser.</div>'; }\n}\n$("progPhotoBtn").onclick=()=>$("progPhotoIn").click();\n$("progPhotoIn").addEventListener("change",async e=>{\n  const file=e.target.files&&e.target.files[0]; e.target.value=""; if(!file) return;\n  try{\n    const date=$("photoDate").value||iso(new Date()), angle=$("photoAngle").value||"front";\n    const blob=await compressProgressPhoto(file);\n    await photoPut({id:date+"-"+angle+"-"+Date.now(),date,angle,createdAt:String(Date.now()),blob});\n    await renderPhotoProgress(); toast("Progress photo saved on this device");\n  }catch(err){ console.error(err); toast("Could not save progress photo"); }\n});\n$("photoAngle").addEventListener("change",renderPhotoProgress);\ndocument.addEventListener("click",async e=>{\n  const pd=e.target.closest("[data-pdel]"); if(!pd) return;\n  try{ await photoRemove(pd.dataset.pdel); await renderPhotoProgress(); toast("Progress photo deleted"); }catch(err){ console.error(err); }\n});\n\n// ── trends charts (MacroFactor-style) ────────────────────────')
          r('  // Body fat: logged values vs 15–17% goal band\n  const bfPts=weights.filter(w=>w.bf!=null&&w.bf!=="").slice(-30);\n  if(bfPts.length<2){\n    $("chBF").innerHTML="";\n    $("chBFcap").textContent="Log BF% with at least 2 weigh-ins to draw this line.";\n  } else {\n    let mn=Math.min(...bfPts.map(p=>p.bf),15)-0.5, mx=Math.max(...bfPts.map(p=>p.bf),17)+0.5;\n    const X=i=>(i/(bfPts.length-1))*300, Y=v=>90-((v-mn)/(mx-mn))*80-5;\n    let s=`<rect x="0" y="${Y(17).toFixed(1)}" width="300" height="${(Y(15)-Y(17)).toFixed(1)}" fill="#188A5618"/>`;\n    s+=`<line x1="0" y1="${Y(17).toFixed(1)}" x2="300" y2="${Y(17).toFixed(1)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>`;\n    s+=`<line x1="0" y1="${Y(15).toFixed(1)}" x2="300" y2="${Y(15).toFixed(1)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>`;\n    s+=`<path d="${bfPts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.bf).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linecap="round"/>`;\n    bfPts.forEach((p,i)=>{ s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.bf).toFixed(1)}" r="2.6" fill="var(--orange)"/>`; });\n    $("chBF").innerHTML=s;\n    $("chBFcap").textContent=`${bfPts[0].bf}% → ${bfPts[bfPts.length-1].bf}% · green band = your 15–17% goal zone`;\n  }','  // Body fat: noisy scale readings as dots + 5-reading smoothed trend\n  const bfPts=weights.filter(w=>w.bf!=null&&w.bf!=="").slice(-30);\n  if(bfPts.length<2){\n    $("chBF").innerHTML="";\n    $("chBFcap").textContent="Log BF% with at least 2 weigh-ins. Individual scale readings can be noisy; the smoothed trend is what matters.";\n  } else {\n    const raw=bfPts.map(p=>+p.bf);\n    const sm=raw.map((v,i)=>{ const w=raw.slice(Math.max(0,i-4),i+1); return w.reduce((a,b)=>a+b,0)/w.length; });\n    let mn=Math.min(...raw,...sm,15)-0.5, mx=Math.max(...raw,...sm,17)+0.5;\n    const X=i=>(i/(bfPts.length-1))*300, Y=v=>90-((v-mn)/(mx-mn))*80-5;\n    let s=`<rect x="0" y="${Y(17).toFixed(1)}" width="300" height="${(Y(15)-Y(17)).toFixed(1)}" fill="#188A5618"/>`;\n    s+=`<line x1="0" y1="${Y(17).toFixed(1)}" x2="300" y2="${Y(17).toFixed(1)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>`;\n    s+=`<line x1="0" y1="${Y(15).toFixed(1)}" x2="300" y2="${Y(15).toFixed(1)}" stroke="var(--green)" stroke-width="1" stroke-dasharray="4 4" opacity=".6"/>`;\n    bfPts.forEach((p,i)=>{ s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(+p.bf).toFixed(1)}" r="2.8" fill="#9AA6C0"/>`; });\n    s+=`<path d="${sm.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--blue)" stroke-width="2.7" stroke-linecap="round"/>`;\n    $("chBF").innerHTML=s;\n    $("chBFcap").textContent=`Gray dots = raw scale BF · Blue = 5-reading trend (${sm[sm.length-1].toFixed(1)}%) · Latest raw ${raw[raw.length-1].toFixed(1)}% · green band = 15–17% goal`;\n  }')
          r('  const rows=[["type","date","time","name","kcal","protein_g","carbs_g","fat_g","saturated_fat_g","unsaturated_fat_g","fat_split_basis","fat_split_confidence","gluten_flag"]];','  const rows=[["type","date","time","name","kcal","protein_g","carbs_g","fat_g","saturated_fat_g","unsaturated_fat_g","fat_split_basis","fat_split_confidence","gluten_flag","navel_cm"]];')
          r('      rows.push(["MEAL",date,m.time||"",m.name,Math.round(m.kcal),Math.round(m.p),Math.round(m.c),Math.round(m.f),si.sf.toFixed(1),si.unsat.toFixed(1),si.source,si.confidence,m.gluten||"none"]);','      rows.push(["MEAL",date,m.time||"",m.name,Math.round(m.kcal),Math.round(m.p),Math.round(m.c),Math.round(m.f),si.sf.toFixed(1),si.unsat.toFixed(1),si.source,si.confidence,m.gluten||"none",""]);')
          r('    rows.push(["DAY_TOTAL",date,"","Daily total ("+dm.length+" meals)",Math.round(s.kcal),Math.round(s.p),Math.round(s.c),Math.round(s.f),s.sf.toFixed(1),unsat.toFixed(1),usedEstimate?"daily total; includes auto-estimates":"daily total from stored values",usedEstimate?"mixed":"recorded",\n      s.kcal<=T.kcal*1.05?"on target":"over by "+Math.round(s.kcal-T.kcal)]);','    rows.push(["DAY_TOTAL",date,"","Daily total ("+dm.length+" meals)",Math.round(s.kcal),Math.round(s.p),Math.round(s.c),Math.round(s.f),s.sf.toFixed(1),unsat.toFixed(1),usedEstimate?"daily total; includes auto-estimates":"daily total from stored values",usedEstimate?"mixed":"recorded",\n      s.kcal<=T.kcal*1.05?"on target":"over by "+Math.round(s.kcal-T.kcal),""]);')
          r('  weights.forEach(w=>rows.push(["WEIGHT",w.date,"","Morning weigh-in"+(w.bf!=null&&w.bf!==""?" ("+w.bf+"% BF)":""),w.kg,"","","","","","","",""]));','  weights.forEach(w=>rows.push(["WEIGHT",w.date,"","Morning weigh-in"+(w.bf!=null&&w.bf!==""?" ("+w.bf+"% BF)":""),w.kg,"","","","","","","","",""]));\n  measurements.forEach(m=>rows.push(["MEASUREMENT",m.date,"","Navel circumference","","","","","","","","","",(+m.navel).toFixed(1)]));')
          r('// init\nconst satBackfilled=backfillSatFatHistory();','// init\n$("navelDate").value=iso(new Date());\n$("photoDate").value=iso(new Date());\nconst satBackfilled=backfillSatFatHistory();')
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "6853215c53f01d8f31c8598b55f4c6575977b3da"
          python3 - <<'PYJS'
          import re, pathlib, subprocess
          html=pathlib.Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',html)
          assert m
          pathlib.Path('/tmp/fuellog.js').write_text(m.group(1))
          subprocess.run(['node','--check','/tmp/fuellog.js'],check=True)
          PYJS
          git config user.name 'ChatGPT FuelLog updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add body composition measurements and progress photos'
          git push origin HEAD:main
