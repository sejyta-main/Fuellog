name: Fix FuelLog progress helper quoting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-progress-helper.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix helper quoting
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/fuellog-progress-upgrade.yml')
          s=p.read_text()
          a="box.innerHTML='"
          b="box.innerHTML=\\'"
          c="</div>'; }"
          d="</div>\\'; }"
          assert s.count(a)==2, s.count(a)
          assert s.count(c)==2, s.count(c)
          s=s.replace(a,b).replace(c,d)
          p.write_text(s)
          PY
          git config user.name 'ChatGPT FuelLog updater'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/fuellog-progress-upgrade.yml
          git commit -m 'Fix progress upgrade helper quoting'
          git push origin HEAD:main
