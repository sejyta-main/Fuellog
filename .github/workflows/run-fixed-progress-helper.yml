name: Run corrected FuelLog progress upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-fixed-progress-helper.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Execute corrected progress patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "3b1c93ace4868fe09d3756f86cea56d8136ba202"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          t=Path('.github/workflows/fuellog-progress-upgrade.yml').read_text()
          marker="python3 - <<'PY'\n"
          i=t.index(marker)+len(marker)
          j=t.index("\n          PY\n",i)
          code=textwrap.dedent(t[i:j])
          code=code.replace("box.innerHTML='<div","box.innerHTML=\\'<div")
          code=code.replace("</div>'; }","</div>\\'; }")
          assert code.count("box.innerHTML=\\'<div")==2
          Path('/tmp/patch.py').write_text(code)
          subprocess.run(['python3','/tmp/patch.py'],check=True)
          PY
          test "$(git hash-object index.html)" = "6853215c53f01d8f31c8598b55f4c6575977b3da"
          python3 - <<'PYJS'
          import re, pathlib, subprocess
          html=pathlib.Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',html)
          assert m
          pathlib.Path('/tmp/fuellog.js').write_text(m.group(1))
          subprocess.run(['node','--check','/tmp/fuellog.js'],check=True)
          PYJS
          git config user.name 'ChatGPT FuelLog updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add body composition measurements and progress photos'
          git push origin HEAD:main
