name: Apply FuelLog carbs trend chart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuellog-carbs-chart.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add carbohydrate trend chart
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "15abe520335959c39ee13ba504ab4418a49526da"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''      <div class="muted" style="font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:4px">FAT — LAST 14 DAYS vs 70 G</div>\n      <svg id="chFat" width="100%" height="90" viewBox="0 0 300 90" preserveAspectRatio="none" aria-label="Fat chart"></svg>\n      <div class="muted" style="font-size:11.5px;margin:2px 0 0">Solid bottom = saturated · Light top = derived unsaturated (total fat − saturated) · Gray dash = 70g total · Red dash = ~25g saturated guide. Missing sat-fat values are auto-estimated; stored values always take priority.</div>'''
          new='''      <div class="muted" style="font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:4px">FAT — LAST 14 DAYS vs 70 G</div>\n      <svg id="chFat" width="100%" height="90" viewBox="0 0 300 90" preserveAspectRatio="none" aria-label="Fat chart"></svg>\n      <div class="muted" style="font-size:11.5px;margin:2px 0 14px">Solid bottom = saturated · Light top = derived unsaturated (total fat − saturated) · Gray dash = 70g total · Red dash = ~25g saturated guide. Missing sat-fat values are auto-estimated; stored values always take priority.</div>\n      <div class="muted" style="font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:4px">CARBS — LAST 14 DAYS vs 240 G</div>\n      <svg id="chC" width="100%" height="90" viewBox="0 0 300 90" preserveAspectRatio="none" aria-label="Carbohydrate chart"></svg>\n      <div class="muted" style="font-size:11.5px;margin:2px 0 0">Green = at/under 240g · Amber = over · Dashed = 240g target · Gray tick = no log</div>'''
          assert old in s
          s=s.replace(old,new,1)
          old2='''  barsChart("chP", days.map(d=>({v:d.s.p,logged:d.logged})), T.protein, v=>v>=T.protein*0.89);\n  fatStackChart("chFat", days.map(d=>({v:d.s.f,sf:d.s.sf,logged:d.logged})), T.fat);'''
          new2='''  barsChart("chP", days.map(d=>({v:d.s.p,logged:d.logged})), T.protein, v=>v>=T.protein*0.89);\n  fatStackChart("chFat", days.map(d=>({v:d.s.f,sf:d.s.sf,logged:d.logged})), T.fat);\n  barsChart("chC", days.map(d=>({v:d.s.c,logged:d.logged})), T.carbs, v=>v<=T.carbs*1.05);'''
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "3b1c93ace4868fe09d3756f86cea56d8136ba202"
          python3 - <<'PY'
          import re, pathlib, subprocess
          html=pathlib.Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',html)
          assert m
          pathlib.Path('/tmp/fuellog.js').write_text(m.group(1))
          subprocess.run(['node','--check','/tmp/fuellog.js'],check=True)
          PY
          git config user.name 'ChatGPT FuelLog updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add carbohydrate trend chart'
          git push origin HEAD:main
