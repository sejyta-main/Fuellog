name: Apply FuelLog historical fat backfill v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuellog-backfill-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add one-time historical fat migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "6ca99455df8fb1d8c708cff43e69e854737d935d"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''function satInfo(m){\n  const fat=Math.max(0,+m.f||0);\n  if(m.sf!=null&&!isNaN(+m.sf)){\n    const sf=Math.round(Math.max(0,Math.min(fat,+m.sf))*10)/10;\n    return {sf,unsat:Math.round(Math.max(0,fat-sf)*10)/10,source:m.sfSource||"stored value",confidence:m.sfConfidence||"recorded",estimated:false};\n  }\n  return estimateSatFat(m.name,fat);\n}\nfunction updateManualSFHint(){'''
          new='''function satInfo(m){\n  const fat=Math.max(0,+m.f||0);\n  if(m.sf!=null&&!isNaN(+m.sf)){\n    const sf=Math.round(Math.max(0,Math.min(fat,+m.sf))*10)/10;\n    return {sf,unsat:Math.round(Math.max(0,fat-sf)*10)/10,source:m.sfSource||"stored value",confidence:m.sfConfidence||"recorded",estimated:false};\n  }\n  return estimateSatFat(m.name,fat);\n}\n\n// One-time v2 migration: permanently fill historical meals that are missing sf.\n// Unsaturated fat stays derived (total fat - sf) so edits can never make the split inconsistent.\nfunction backfillSatFatHistory(){\n  const marker="fl:satBackfill:v2";\n  if(localStorage.getItem(marker)==="done") return 0;\n  const keys=Object.keys(localStorage).filter(k=>k.startsWith("fl:log:")).sort();\n  const staged=[];\n  let updated=0;\n  // Stage every estimate first. Nothing is written during this pass, so a newly\n  // estimated meal cannot influence another meal's history-match confidence.\n  keys.forEach(k=>{\n    const dm=load(k,[]); let changed=false;\n    dm.forEach(m=>{\n      if(m.sf==null || isNaN(+m.sf)){\n        const si=estimateSatFat(m.name,+m.f||0);\n        m.sf=Math.round(si.sf*10)/10;\n        m.sfSource="backfill v2 · "+si.source;\n        m.sfConfidence=si.confidence;\n        m.sfEstimated=true;\n        changed=true; updated++;\n      }\n    });\n    if(changed) staged.push([k,dm]);\n  });\n  staged.forEach(([k,dm])=>save(k,dm));\n  localStorage.setItem(marker,"done");\n  satEstCache.clear();\n  return updated;\n}\nfunction updateManualSFHint(){'''
          assert old in s
          s=s.replace(old,new,1)
          old2='''// init\nrenderToday(); renderBuild(); renderProgress();'''
          new2='''// init\nconst satBackfilled=backfillSatFatHistory();\nif(satBackfilled){ meals=load(KV(),[]); }\nrenderToday(); renderBuild(); renderProgress();\nif(satBackfilled) setTimeout(()=>toast("Fat history backfilled: "+satBackfilled+" meal"+(satBackfilled===1?"":"s")),120);'''
          assert old2 in s
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          test "$(git hash-object index.html)" = "15abe520335959c39ee13ba504ab4418a49526da"
          python3 - <<'PY'
          import re, pathlib, subprocess
          html=pathlib.Path('index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',html)
          assert m
          pathlib.Path('/tmp/fuellog.js').write_text(m.group(1))
          subprocess.run(['node','--check','/tmp/fuellog.js'],check=True)
          PY
          git config user.name 'ChatGPT FuelLog updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Backfill historical saturated-fat values on first load'
          git push origin HEAD:main
