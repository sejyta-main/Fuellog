name: Apply verified FuelLog saturated-fat update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fuellog-satfat-update.yml'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply and verify FuelLog patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/fuellog.patch.b64
          printf '%s' '' >> /tmp/fuellog.patch.b64
          printf '%s' '' >> /tmp/fuellog.patch.b64
          base64 -d /tmp/fuellog.patch.b64 > /tmp/fuellog.patch
          test "$(git hash-object index.html)" = "ea3d9b54d580b38deac825fa817fbee03429f54d"
          git apply --check /tmp/fuellog.patch
          git apply /tmp/fuellog.patch
          test "$(git hash-object index.html)" = "6ca99455df8fb1d8c708cff43e69e854737d935d"
          python3 - <<'PY'
          import re, pathlib, subprocess
          html = pathlib.Path('index.html').read_text()
          m = re.search(r'<script>([\s\S]*?)</script>', html)
          assert m, 'script block not found'
          pathlib.Path('/tmp/fuellog.js').write_text(m.group(1))
          subprocess.run(['node','--check','/tmp/fuellog.js'], check=True)
          PY
          git config user.name 'ChatGPT FuelLog updater'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add automatic saturated-fat split and CSV export'
          git push origin HEAD:main
